<title>دليل معايرة الماصات | غرفة المعايرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Thmanyah Sans';src:url('fonts/thmanyahsans-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url('fonts/thmanyahsans-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url('fonts/thmanyahsans-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url('fonts/thmanyahsans-Black.woff2') format('woff2');font-weight:900;font-display:swap}
@font-face{font-family:'Thmanyah Serif Display';src:url('fonts/thmanyahserifdisplay-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Thmanyah Serif Display';src:url('fonts/thmanyahserifdisplay-Black.woff2') format('woff2');font-weight:900;font-display:swap}
:root{
  --paper:#f4ead6; --paper2:#efe2c8; --ink:#2b241c; --ink2:#5a4d3c;
  --red:#d42a1f; --green:#3f8a3a; --line:#d9c9a8;
  --tab1:#7fa86b; --tab2:#d9725b; --tab3:#6b93b8; --tab4:#c9a34a; --tab5:#8e7bb5; --tab6:#7d8b8f;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#8d7a58}html,body{min-height:100%}
body{
  font-family:'Thmanyah Sans',sans-serif;color:var(--ink);
  background:
    radial-gradient(ellipse at 30% 10%, rgba(255,255,255,.18), transparent 55%),
    radial-gradient(ellipse at 70% 90%, rgba(0,0,0,.35), transparent 60%),
    linear-gradient(170deg,#8ca3a8 0%,#b8b096 38%,#c9b88f 55%,#8d7a58 100%);
  background-attachment:fixed;
  padding:max(14px,env(safe-area-inset-top)) 10px max(18px,env(safe-area-inset-bottom));
  min-height:100%;
}
bdi.en{font-family:'Thmanyah Sans',sans-serif;font-weight:700;font-size:.95em;color:#3b2f22;letter-spacing:.2px}
.wrap{max-width:860px;margin:0 auto;position:relative}

/* ---------- notebook ---------- */
.book{position:relative;margin-left:34px;margin-right:46px}
.spiral{position:absolute;left:-30px;top:18px;bottom:18px;width:40px;z-index:3;
  background:repeating-linear-gradient(to bottom, transparent 0 9px, #1d1b19 9px 12px, #4a4744 12px 13px, #1d1b19 13px 16px, transparent 16px 26px);
  -webkit-mask:linear-gradient(90deg,#000 0 100%);
}
.spiral::before{content:"";position:absolute;right:2px;top:0;bottom:0;width:10px;
  background:repeating-linear-gradient(to bottom, transparent 0 8px, #2a2622 8px 17px, transparent 17px 26px);
  border-radius:6px;opacity:.55}
.page{
  position:relative;background:var(--paper);
  border-radius:6px 14px 14px 6px;
  box-shadow:0 2px 0 #e6d6b6,0 4px 0 #dccaa6,0 6px 0 #d2bf98, 0 22px 40px rgba(30,20,5,.45);
  padding:26px 26px 22px 30px;min-height:560px;overflow:hidden;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(160,120,60,.10), transparent 30%),
    radial-gradient(circle at 85% 70%, rgba(160,120,60,.12), transparent 35%),
    radial-gradient(circle at 50% 100%, rgba(120,90,40,.10), transparent 40%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .35  0 0 0 0 .2  0 0 0 .09 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
}
.page::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  box-shadow:inset 0 0 40px rgba(120,85,35,.22), inset 18px 0 22px -14px rgba(60,40,10,.35)}
.holes{position:absolute;left:8px;top:18px;bottom:18px;width:10px;
  background:repeating-linear-gradient(to bottom, transparent 0 9px, #6e6253 9px 16px, transparent 16px 26px);
  border-radius:5px;opacity:.5}
.flip-in{animation:flip .45s cubic-bezier(.2,.7,.2,1)}
@keyframes flip{from{opacity:0;transform:perspective(1200px) rotateY(-14deg) translateX(18px)}to{opacity:1;transform:none}}

/* ---------- tabs ---------- */
.tabs{position:absolute;right:-46px;top:34px;display:flex;flex-direction:column;gap:6px;z-index:1}
.tab{width:50px;height:58px;border:none;cursor:pointer;border-radius:0 10px 10px 0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:#fffaf0;font-family:'Thmanyah Sans';font-weight:800;font-size:9.5px;line-height:1.05;
  box-shadow:inset 3px 0 6px rgba(0,0,0,.25), 2px 2px 4px rgba(0,0,0,.25);
  transform:translateX(-10px);transition:transform .2s, filter .2s;filter:saturate(.75) brightness(.95);
  padding:4px 2px 4px 8px}
.tab svg{width:22px;height:22px;stroke:#fffaf0;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{transform:translateX(0);filter:none;box-shadow:inset 3px 0 6px rgba(0,0,0,.15),3px 3px 6px rgba(0,0,0,.35)}
.tab .tn{font-family:'Permanent Marker';font-size:8px;letter-spacing:.3px;opacity:.9;direction:ltr}

/* ---------- header ---------- */
.credit{font-family:'Thmanyah Sans',sans-serif;font-size:11.5px;font-weight:500;color:#8b7a60;letter-spacing:.4px;text-align:center;margin:-8px 0 10px;opacity:.9}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;border-bottom:2px dashed var(--line);padding-bottom:10px;margin-bottom:12px}
.ph h1{font-family:'Thmanyah Serif Display';font-weight:900;font-size:30px;line-height:1.15;color:#2b241c}
.ph .en-t{font-family:'Permanent Marker';font-size:15px;color:#6d5d47;direction:ltr;text-align:right;letter-spacing:.6px}
.pgno{font-family:'Permanent Marker';font-size:13px;color:#8b7a60;white-space:nowrap;direction:ltr;padding-top:6px}

/* ---------- equation row ---------- */
.eq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 4px;margin:4px 0 16px}
.eq .it{display:flex;flex-direction:column;align-items:center;gap:3px;width:92px}
.eq .ic{width:74px;height:74px;border-radius:14px;overflow:hidden;border:2.5px solid #3a2f22;background:#fff8ea;
  box-shadow:2px 3px 0 rgba(58,47,34,.25);transform:rotate(-2deg)}
.eq .it:nth-child(4n+3) .ic{transform:rotate(2.5deg)}
.eq .ic img{width:100%;height:100%;object-fit:cover}
.eq .lb{font-size:11.5px;font-weight:700;text-align:center;line-height:1.2;color:#4b3f30}
.eq .plus{font-family:'Permanent Marker';font-size:34px;color:#2b241c;margin:0 2px 18px;line-height:1}

/* ---------- step panels ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.card{min-width:0}
.card{position:relative;background:#fbf4e4;border:2px solid #3a2f22;border-radius:12px;padding:10px 10px 12px;
  box-shadow:3px 4px 0 rgba(58,47,34,.18)}
.card.wide{grid-column:1/-1}
.card .num{position:absolute;top:-12px;right:-10px;width:32px;height:32px;border-radius:50%;
  background:#2b241c;color:#f4ead6;font-family:'Permanent Marker';font-size:16px;display:flex;align-items:center;justify-content:center;
  box-shadow:2px 2px 0 rgba(0,0,0,.25);z-index:2;direction:ltr}
.card.pass{border-color:#3f8a3a}.card.pass .num{background:#3f8a3a}
.card.alt{border-color:#c9a34a;border-style:dashed}.card.alt .num{background:#c9a34a}
.card.fail{border-color:var(--red)}.card.fail .num{background:var(--red)}
.card h3{font-family:'Thmanyah Serif Display';font-weight:900;font-size:19px;margin:2px 4px 8px 24px;line-height:1.25}
.card h3 .en-s{display:block;font-family:'Permanent Marker';font-size:11.5px;color:#7b6a52;direction:ltr;text-align:right;letter-spacing:.4px}
.shots{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;--h:165px}
.shots.multi .shot{flex:0 1 auto;width:calc(var(--h) * var(--r));max-width:100%;aspect-ratio:var(--r)}
.shots.one .shot{flex:1 1 auto;width:100%}
.card.wide .shots.one .shot{max-width:min(540px, calc(400px * var(--r)))}
.shot{position:relative;min-width:0;border:2px solid #4a3d2d;border-radius:8px;overflow:hidden;background:#e9dcc2;cursor:zoom-in}
.shot img{display:block;width:100%;height:auto}
.shot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.shot .cap{position:absolute;bottom:4px;right:4px;left:4px;text-align:center}
.shot .cap span{background:rgba(251,244,228,.92);border:1.5px solid #3a2f22;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:800;display:inline-block}
.arrowR{flex:0 0 auto;width:26px;height:26px}
.card p.t{font-size:14.5px;line-height:1.75;margin-top:9px;color:#2f271e}
.card p.t b{color:#000}
.card ul.t{margin:9px 18px 0 0;font-size:14px;line-height:1.75}
.card ul.t li{margin-bottom:2px}
.tag{display:inline-block;font-family:'Permanent Marker';font-size:12px;padding:1px 9px;border-radius:5px;color:#fff;margin-left:6px;direction:ltr}
.tag.g{background:var(--green)}.tag.r{background:var(--red)}

/* drawing animation */
.mk{stroke:var(--red);stroke-width:var(--sw,1);fill:none;stroke-linecap:round;stroke-linejoin:round}
.mk.g{stroke:#2f8a2a}
.mk.cyan{stroke:#0a8fb5}
.draw .mk{stroke-dasharray:1;stroke-dashoffset:1;animation:dr .7s ease forwards;animation-delay:var(--d,.2s)}
@keyframes dr{to{stroke-dashoffset:0}}
.mkt{font-family:'Caveat','Thmanyah Sans',cursive;font-weight:900;fill:var(--red);paint-order:stroke;stroke:#fbf4e4;stroke-width:calc(var(--sw,1)*1.3)}

/* ---------- banner ---------- */
.banner{margin-top:16px;background:#e7b8a6;border:2px solid #9c3b2a;border-radius:8px;padding:10px 14px;
  display:flex;gap:10px;align-items:center;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.banner svg{flex:0 0 30px;width:30px;height:30px}
.banner p{font-size:14.5px;font-weight:700;line-height:1.6;color:#4a160d}
.banner.info{background:#c9dcc0;border-color:#3f6b38}.banner.info p{color:#1f3a1b}

/* ---------- footer nav ---------- */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:8px}
.nav button{font-family:'Thmanyah Serif Display';font-weight:700;font-size:17px;border:2px solid #3a2f22;background:#fff7e6;color:#2b241c;border-radius:10px;padding:6px 14px;cursor:pointer;box-shadow:2px 3px 0 rgba(58,47,34,.25)}
.nav button:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:#cdbb95;border:1.5px solid #6e5e45}.dots i.on{background:#2b241c}
.brand{text-align:center;color:#3e3324;font-size:12px;margin-top:14px;opacity:.85}
.brand .by{display:inline-block;margin-top:4px;font-size:13px;letter-spacing:.3px}
.brand b{font-family:'Permanent Marker';font-weight:400;direction:ltr;display:inline-block}

/* checklist */
.chk{columns:2;column-gap:22px;margin-top:4px}
.chk label{display:flex;gap:8px;align-items:flex-start;break-inside:avoid;padding:5px 2px;font-size:13.5px;line-height:1.5;border-bottom:1px dashed var(--line);cursor:pointer}
.chk input{appearance:none;flex:0 0 20px;width:20px;height:20px;border:2px solid #3a2f22;border-radius:4px;background:#fffaf0;margin-top:2px;position:relative;cursor:pointer}
.chk input:checked::after{content:"";position:absolute;left:4px;top:-4px;width:8px;height:15px;border:solid #2f8a2a;border-width:0 3.5px 3.5px 0;transform:rotate(40deg)}
.chk label.done span{color:#8b7a60;text-decoration:line-through}
.chk .sec{column-span:all;font-family:'Thmanyah Serif Display';font-weight:700;font-size:17px;margin:10px 0 2px;color:#5a4a33}
.reset{font-family:'Thmanyah Sans';font-weight:700;font-size:13px;margin-top:10px;background:none;border:1.5px dashed #6e5e45;border-radius:8px;padding:4px 12px;cursor:pointer;color:#4a3d2d}

/* zoom */
.zoom{position:fixed;inset:0;background:rgba(20,15,8,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;cursor:zoom-out}
.zoom.on{display:flex}
.zoom .zb{position:relative;max-width:min(96vw,1100px);width:100%}
.zoom .zb img{width:100%;height:auto;border-radius:10px;border:3px solid #f4ead6}
.zoom .zb svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

@media (max-width:640px){
  body{padding-left:4px;padding-right:4px}
  .book{margin-left:16px;margin-right:36px}
  .spiral{left:-20px;width:28px}
  .tabs{right:-36px;top:24px;gap:5px}
  .tab{width:36px;height:48px;font-size:0;padding-left:4px;transform:translateX(-4px)}
  .tab.on{transform:translateX(0);width:38px}
  .tab .tn{display:none}
  .tab svg{width:20px;height:20px}
  .page{padding:18px 12px 16px 18px}
  .ph{flex-direction:column-reverse;gap:2px}
  .card p.t{font-size:14px}
  .ph h1{font-size:24px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .eq .it{width:72px}.eq .ic{width:60px;height:60px}.eq .plus{font-size:26px}
  .chk{columns:1}
  .shots.multi{--h:140px !important}
}
@media print{
  body{background:#fff}.tabs,.nav,.spiral{display:none}.book{margin:0}
}
</style>
</head>

/* ---------- drawing helpers (hand-drawn feel) ---------- */
function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function circlePath(cx,cy,r,seed){
  const R=rnd(seed); let d='', pts=[]; const turns=1.15, n=40, start=R()*6.28;
  for(let k=0;k<=n;k++){const a=start+k/n*turns*6.283; const rr=r*(1+(R()-.5)*.08+(k/n)*.06);
    pts.push([cx+Math.cos(a)*rr*1.08, cy+Math.sin(a)*rr*.94]);}
  d='M'+pts.map(p=>p[0].toFixed(2)+' '+p[1].toFixed(2)).join(' L');
  return d;
}
function arrowPath(x1,y1,x2,y2){
  const mx=(x1+x2)/2+(y2-y1)*.18, my=(y1+y2)/2-(x2-x1)*.18;
  const ang=Math.atan2(y2-my,x2-mx), L=Math.max(3.2,Math.hypot(x2-x1,y2-y1)*.12);
  const h1=[x2-L*Math.cos(ang-.5),y2-L*Math.sin(ang-.5)], h2=[x2-L*Math.cos(ang+.5),y2-L*Math.sin(ang+.5)];
  return `M${x1} ${y1} Q${mx} ${my} ${x2} ${y2} M${h1[0]} ${h1[1]} L${x2} ${y2} L${h2[0]} ${h2[1]}`;
}
function overlay(meta, marks, big){
  const ratio = meta[1], H = 100/ratio; let s='', seed=7, delay=.25;
  const P = (x,y)=>[x*100, y*H];
  for(const m of marks||[]){
    const d = (m.d!=null? m.d : delay); delay += .35; const cls = m.cls||'';
    if(m.c){const [x,y]=P(m.c[0],m.c[1]); const r=m.c[2]*100;
      s+=`<path pathLength="1" class="mk ${cls}" style="--d:${d}s;--len:${(r*7.5).toFixed(0)}" d="${circlePath(x,y,r,seed++)}"/>`;
      if(m.a){const [fx,fy]=P(m.a[0],m.a[1]); const ang=Math.atan2(fy-y,fx-x); const ex=x+Math.cos(ang)*r*1.15, ey=y+Math.sin(ang)*r*1.05;
        s+=`<path pathLength="1" class="mk ${cls}" style="--d:${d+.35}s;--len:300" d="${arrowPath(fx,fy,ex,ey)}"/>`;}
    }
    if(m.b){const [x0,y0]=P(m.b[0],m.b[1]),[x1,y1]=P(m.b[2],m.b[3]); const j=.6;
      s+=`<path pathLength="1" class="mk ${cls}" style="--d:${d}s;--len:${(2*(x1-x0+y1-y0)+40).toFixed(0)}" d="M${x0-j} ${y0+j} L${x1+j} ${y0-j} L${x1-j} ${y1+j} L${x0+j} ${y1-j} Z M${x0-j} ${y0+j} L${x0+3} ${y0}"/>`;}
    if(m.x){const [x,y]=P(m.x[0],m.x[1]); const z=m.x[2]*100;
      s+=`<path pathLength="1" class="mk" style="--d:${d}s;--len:200;stroke-width:calc(var(--sw,1)*1.35)" d="M${x-z} ${y-z} L${x+z} ${y+z} M${x+z} ${y-z} L${x-z} ${y+z}"/>`;}
    if(m.t){const [x,y]=P(m.t[0],m.t[1]); const fs = Math.max(6.5, Math.min(9, 100/ratio*.11)) * (ratio>2.5? .7:1);
      const ltr=!/[\u0600-\u06FF]/.test(m.t[2]); s+=`<text class="mkt" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}" ${ltr?'direction="ltr" unicode-bidi="embed"':''} ${m.g?'style="fill:#2f8a2a"':''}>${m.t[2]}</text>`;}
  }
  return `<svg viewBox="0 0 100 ${H.toFixed(2)}" preserveAspectRatio="none">${s}</svg>`;
}

const WINLOGIN_SVG = `<div class="shot" style="cursor:default;background:#fbf4e4;--r:1.777"><svg viewBox="0 0 320 180" style="position:static;width:100%;height:auto;display:block">
  <defs><linearGradient id="wl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a8fd6"/><stop offset="1" stop-color="#1c4f8f"/></linearGradient></defs>
  <rect width="320" height="180" fill="url(#wl)"/>
  <rect x="136" y="26" width="48" height="48" rx="8" fill="#fffaf0" stroke="#2b241c" stroke-width="2.5"/>
  <circle cx="160" cy="44" r="9" fill="#8fb3d6" stroke="#2b241c" stroke-width="1.8"/><path d="M144 68 q16 -18 32 0" fill="#8fb3d6" stroke="#2b241c" stroke-width="1.8"/>
  <text x="160" y="92" text-anchor="middle" font-family="Thmanyah Sans,Arial" font-weight="800" font-size="12" fill="#fff">اسم المستخدم (الخاص بالقسم)</text>
  <rect x="104" y="102" width="112" height="20" rx="3" fill="#fffaf0" stroke="#2b241c" stroke-width="2"/>
  <text x="114" y="116" font-family="Arial" font-size="12" fill="#2b241c">●●●●●●</text>
  <rect x="220" y="102" width="20" height="20" rx="3" fill="#2d6fb6" stroke="#2b241c" stroke-width="2"/><path d="M226 112 h9 M231 107 l5 5 l-5 5" stroke="#fff" stroke-width="2" fill="none"/>
  <path class="mk" pathLength="1" style="--d:.4s" d="M98 98 L222 98 L220 126 L100 127 Z"/>
  <path class="mk" pathLength="1" style="--d:.8s" d="M60 160 Q70 125 98 116 M90 113 L98 116 L94 123"/>
  <text class="mkt" x="62" y="168" text-anchor="middle" font-size="12" direction="ltr">Password</text>
  <text x="250" y="172" font-family="Arial" font-weight="700" font-size="11" fill="#cfe3f5" direction="ltr">Windows</text>
</svg></div>`;
function shotHTML(sh, key){
  if(sh.arrow) return ARROW_SVG;
  if(sh.svg==='shutdown') return SHUTDOWN_SVG;
  if(sh.svg==='door') return DOOR_SVG;
  if(sh.svg==='winlogin') return WINLOGIN_SVG;
  const meta = IMG[sh.i];
  return `<div class="shot" data-k="${key}" style="--r:${meta[1].toFixed(3)}">
    <img src="${meta[0]}" alt="" loading="lazy">${overlay(meta, sh.m)}${sh.cap?`<div class="cap"><span>${sh.cap}</span></div>`:''}</div>`;
}
function checklistHTML(){
  let st={}; try{st=JSON.parse(localStorage.getItem('pipcal_chk')||'{}')}catch(e){}
  let h='<div class="chk">', k=0;
  for(const [sec,items] of CHECK){ h+=`<div class="sec">${sec}</div>`;
    for(const it of items){ const id='c'+(k++); const on=!!st[id];
      h+=`<label class="${on?'done':''}"><input type="checkbox" data-id="${id}" ${on?'checked':''}><span>${it}</span></label>`;}}
  return h+'</div><button class="reset" id="resetChk">مسح القائمة لماصة جديدة</button>';
}

let cur = 0;
function render(i, anim=true){
  cur = i; const p = PAGES[i];
  document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('on',k===i));
  const eq = p.eq.map(([k,l],j)=>`${j?'<div class="plus">+</div>':''}<div class="it"><div class="ic"><img src="${IMG[k][0]}" alt=""></div><div class="lb">${l}</div></div>`).join('');
  const cards = p.cards.map((c,ci)=>`
    <section class="card ${c.wide?'wide':''} ${c.cls||''}">
      <div class="num">${c.n}</div>
      <h3>${c.h}<span class="en-s">${c.hs}</span></h3>
      ${c.checklist? checklistHTML() : `<div class="shots ${c.shots.length>1?'multi':'one'}" style="${c.wide?'':'--h:150px'}">${c.shots.map((s,si)=>shotHTML(s, ci+'-'+si)).join('')}</div>
      <p class="t">${c.t}</p>${c.ul?`<ul class="t">${c.ul.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}`}
    </section>`).join('');
  const warn = `<svg viewBox="0 0 30 30"><path d="M15 3 L28 26 H2 Z" fill="#fff3e6" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" style="color:${p.bannerType==='info'?'#3f6b38':'#9c3b2a'}"/><path d="M15 11v7M15 21.5v.5" stroke="${p.bannerType==='info'?'#3f6b38':'#9c3b2a'}" stroke-width="2.8" stroke-linecap="round"/></svg>`;
  const html = `
    <div class="credit" dir="ltr">© Prepared by Fahad F Alanazi</div>
    <header class="ph"><div><h1>${p.title}</h1><div class="en-t">${p.en}</div></div><div class="pgno">${i+1} / ${PAGES.length}</div></header>
    <div class="eq">${eq}</div>
    <div class="grid draw">${cards}</div>
    <div class="banner ${p.bannerType||''}">${warn}<p>${p.banner}</p></div>
    <div class="nav">
      <button id="prev" ${i===0?'disabled':''}>→ السابق</button>
      <div class="dots">${PAGES.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
      <button id="next" ${i===PAGES.length-1?'disabled':''}>التالي ←</button>
    </div>`;
  const c = document.getElementById('content'); c.innerHTML = html;
  const pg = document.getElementById('page');
  if(anim){ pg.classList.remove('flip-in'); void pg.offsetWidth; pg.classList.add('flip-in'); window.scrollTo({top:0,behavior:'smooth'}); }
  document.getElementById('prev').onclick=()=>go(cur-1);
  document.getElementById('next').onclick=()=>go(cur+1);
  c.querySelectorAll('.shot[data-k]').forEach(el=>el.onclick=()=>openZoom(el));
  c.querySelectorAll('.chk input').forEach(inp=>inp.onchange=()=>{
    let st={}; try{st=JSON.parse(localStorage.getItem('pipcal_chk')||'{}')}catch(e){}
    st[inp.dataset.id]=inp.checked; inp.parentElement.classList.toggle('done',inp.checked);
    try{localStorage.setItem('pipcal_chk',JSON.stringify(st))}catch(e){} });
  sizeStrokes(c);
  const rb=document.getElementById('resetChk'); if(rb) rb.onclick=()=>{try{localStorage.removeItem('pipcal_chk')}catch(e){} render(cur,false)};
}
function sizeStrokes(root){
  (root||document).querySelectorAll('.shot svg').forEach(sv=>{const w=sv.getBoundingClientRect().width||300; const vb=sv.viewBox.baseVal; const u=vb&&vb.width?vb.width:100;
    sv.style.setProperty('--sw', (3.2*u/w).toFixed(3)); });
}
window.addEventListener('resize',()=>sizeStrokes());
function go(i){ if(i<0||i>=PAGES.length) return; if(location.hash!=='#'+PAGES[i].id){ location.hash = PAGES[i].id; } else render(i); }
function fromHash(){ const h=location.hash.slice(1); const i=PAGES.findIndex(p=>p.id===h); render(i<0?0:i); }

function openZoom(el){
  const zb=document.getElementById('zb'); zb.innerHTML = el.innerHTML;
  zb.querySelectorAll('.mk').forEach(m=>m.style.animation='none');
  document.getElementById('zoom').classList.add('on');
  requestAnimationFrame(()=>sizeStrokes(zb));
}
document.getElementById('zoom').onclick=()=>document.getElementById('zoom').classList.remove('on');

document.getElementById('tabs').innerHTML = PAGES.map((p,k)=>`<button class="tab" style="background:${p.color}" aria-label="${p.tab}" data-i="${k}"><svg viewBox="0 0 24 24">${ICONS[p.icon]}</svg>${p.tab}<span class="tn">${p.tn}</span></button>`).join('');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(+t.dataset.i));

// swipe
let sx=null, sy=null;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.6){ go(cur + (dx>0?1:-1)); } sx=null; },{passive:true});
document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') go(cur+1); if(e.key==='ArrowRight') go(cur-1); if(e.key==='Escape') document.getElementById('zoom').classList.remove('on'); });
window.addEventListener('hashchange',fromHash);
fromHash();
</script>
</body>
</html>
